name: Push diário

on:
  schedule:
    - cron: '0 7 * * *'   # 7:00 UTC — o GitHub costuma atrasar ~3h30-4h a execucao real, entao isso tende a cair perto das 8h em Fortaleza (UTC-3)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install web-push@3
      - run: node scripts/send-push.js
        env:
          VRUNN_EMAIL: ${{ secrets.VRUNN_EMAIL }}
          VRUNN_SENHA: ${{ secrets.VRUNN_SENHA }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
